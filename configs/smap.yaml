{
  "dataset": "smap",
  "seed": 42,
  "device": "cuda",
  "protocol": {
    "name": "smap_main",
    "notes": "Keep method/protocol fixed; run cross-dataset validation on SMAP."
  },
  "data": {
    "omni_dir": "dataset/dataset/SMAP/data/data",
    "channel": "A-1",
    "labeled_anomalies_csv": "dataset/dataset/SMAP/labeled_anomalies.csv",
    "spacecraft": "SMAP",
    "train_path": null,
    "test_path": null,
    "test_label_path": null,
    "window_size": 64,
    "short_window": 16,
    "val_ratio": 0.2,
    "stride_train": 1,
    "stride_test": 1,
    "batch_size": 128,
    "num_workers": 0
  },
  "model": {
    "in_channels": 1,
    "hidden_channels": 64,
    "latent_channels": 32,
    "dropout": 0.1
  },
  "train": {
    "epochs": 30,
    "lr": 0.001,
    "weight_decay": 0.0001,
    "patience": 6,
    "lambda_rec": 1.0,
    "lambda_s": 0.3,
    "lambda_l": 0.3,
    "cov_type": "corr"
  },
  "eval": {
    "alpha": 0.6,
    "beta": 0.15,
    "gamma": 0.2,
    "smooth_window": 3,
    "threshold_mode": "pot",
    "pot_q": 0.93,
    "pot_target_prob": 0.005
  },
  "output": {
    "dir": "outputs/smap_main"
  }
}
