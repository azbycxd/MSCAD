{
  "dataset": "hai",
  "data_root": "D:/workspace/python/mscad/dataset/dataset/hai-22.04",
  "device": "cuda",
  "seeds": [1, 2, 3],
  "tiny_checkpoint_pattern": "outputs/hai_step3a_rec_baseline_seed{seed}/best.pt",
  "tiny_score_pattern": "outputs/hai_step3d_rec_channel_calibration/rec_channel_scores_seed{seed}.npz",
  "source_output_dirs": [
    "outputs/hai_step3a_rec_baseline_seed1", "outputs/hai_step3a_rec_baseline_seed2",
    "outputs/hai_step3a_rec_baseline_seed3", "outputs/hai_step3c_rec_score_alignment",
    "outputs/hai_step3d_rec_channel_calibration", "outputs/hai_step3e_rec_causal_alarm_policy",
