  "thresholds": {"pot_q": 0.95, "pot_target_prob": 0.005, "validation_q99": 0.99},
  "score": {"name": "endpoint_raw_top5", "top_k": 5, "pointwise": true},
  "tiny_consistency": {"absolute_tolerance": 0.0001, "relative_tolerance": 0.000001},
  "efficiency": {"warmup": 10, "repetitions": 100, "batch_size": 128},
  "smoke": {"max_rows_per_file": 25000, "max_windows_per_sequence": 2048, "epochs": 1},
  "output_dir": "outputs/hai_step3g_rec_capacity_ablation",
  "smoke_output_dir": "outputs/hai_step3g_rec_capacity_ablation_smoke"
