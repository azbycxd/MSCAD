{
  "dataset": "swat",
  "seed": 42,
  "device": "cuda",
  "data": {
    "train_csv": "Swat/normal.csv",
    "test_csv": "Swat/merged.csv",
    "label_col": "Normal/Attack",
    "timestamp_col": "Timestamp",
    "window_size": 64,
    "short_window": 16,
    "val_ratio": 0.2,
    "stride_train": 1,
    "stride_test": 1,
    "batch_size": 128,
    "num_workers": 0
  },
  "model": {
    "in_channels": 51,
    "hidden_channels": 64,
    "latent_channels": 32,
    "dropout": 0.1
  },
  "train": {
    "epochs": 50,
    "lr": 0.001,
    "weight_decay": 0.0001,
    "patience": 8,
    "lambda_rec": 1.0,
    "lambda_s": 0.3,
    "lambda_l": 0.3,
    "cov_type": "corr"
  },
  "eval": {
    "alpha": 0.5,
    "beta": 0.25,
    "gamma": 0.25,
    "threshold_mode": "pot",
    "pot_q": 0.98,
    "pot_target_prob": 0.001
  },
  "output": {
    "dir": "outputs/swat_default"
  }
}
